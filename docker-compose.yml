services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_czasomierz
    restart: unless-stopped
    ports:
      # HTTP – dostęp z internetu (podmień na publiczne IP jeśli trzeba)
      - "0.0.0.0:8101:80"
      # Port TCP, na który łączy się SimpleClient / ChronoTrack
      - "0.0.0.0:61611:61611"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Konfiguracja serwera TCP (używa jej receiver.php)
      TCP_LISTEN_HOST: "0.0.0.0"
      TCP_LISTEN_PORT: "61611"
      WAL_DIR: "/var/lib/chronotrack/wal"
    volumes:
      # Kod aplikacji (web + receiver.php)
      - ./src:/var/www/html
      # Trwały katalog na Write-Ahead Log (ochrona przed utratą danych)
      - wal_data:/var/lib/chronotrack/wal
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_net

  mysql:
    image: mysql:8.0
    container_name: mysql_czasomierz
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # NOWE: automatyczna inicjalizacja schematu
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  phpmyadmin:
    depends_on:
      mysql:
        condition: service_healthy
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_czasomierz
    ports:
      - "8102:80"
    environment:
      PMA_HOST: mysql          # ← nazwa serwisu, nie container_name
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M        # opcjonalnie: limit importu plików SQL
    networks:
      - app_net                # ← KLUCZ: ta sama sieć co MySQL
    restart: unless-stopped
    
volumes:
  mysql_data:
  # NOWY wolumen na pliki WAL – dzięki temu dane przetrwają restart kontenera
  wal_data:

networks:
  app_net:
    driver: bridge