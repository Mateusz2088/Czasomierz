services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_czasomierz
    restart: unless-stopped
    ports:
      # 0.0.0.0 = dostęp z internetu (podmień na publiczne IP jeśli trzeba)
      - "0.0.0.0:8101:80"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./src:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_net

  mysql:
    image: mysql:8.0
    container_name: mysql_czasomierz
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # UWAGA: brak portów na zewnątrz – baza widoczna tylko dla PHP
    # Jeśli chcesz dostęp z hosta, dodaj: "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

volumes:
  mysql_data:

networks:
  app_net:
    driver: bridge